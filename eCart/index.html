<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechMart - Product Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>TechMart</h1>
        <p>Smart shopping made simple</p>
    </header>


    <!-- Search Section -->
    <section class="search-section">

        <div class="search-content">

            <h2>Smart Price Finder</h2>

            <p>
                Enter your target price and find the products
                closest to your budget.
            </p>

            <div class="search-box">

                <input
                    type="number"
                    id="priceInput"
                    placeholder="Enter target price"
                >

                <button id="searchBtn">
                    Search
                </button>

                <button id="showAllBtn" class="show-all-btn">
                    Show All
                </button>

            </div>

        </div>

    </section>


    <!-- Products Section -->
    <main class="products-section">

        <div class="section-heading">
            <div>
                <h2 id="productsTitle">All Products</h2>
                <p id="productsSubtitle">
                    Explore all available products
                </p>
            </div>

            <span id="productCount"></span>
        </div>


        <!-- Products will appear here -->
        <div id="productsContainer"></div>

    </main>


    <script src="data.js"></script>
    <script src="app.js"></script>

</body>

</html>
